  - org: Thomson Reuters
    location: Remote
    title: Architect, Cloud Transformation
    dates: January 2019 - July 2022
    summary: "Responsible for technical architecture and the cloud transition of the Global Trade Management project: interviewing and mentoring associate architects, reviewing and approving REST APIs, and managing vendor relationships for product components (AWS OpenSearch, Elastic Cloud, Basis Tech)."
