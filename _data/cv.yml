highlights:
  - "20+ years architecting and leading teams building scalable systems on AWS, with recent focus on GenAI and serverless technologies such as Anthropic models on Bedrock, AgentCore, Lambda, Step Functions, EventBridge and DynamoDB."
  - "Experience embedding AI as actors into workflows, building vector store and RAG pipelines, chunking and knowledge strategies, and using tool calls for deterministic, structured output."
  - "Leveraging AI/LLM tools (Copilot, Claude Code, Amazon Q / Kiro) to accelerate development velocity and team productivity while maintaining code quality and architectural integrity."
  - "Expert in translating business requirements into phased technical delivery that scales, with proven ability to secure funding and executive alignment, and executing on the approach."
  - "Evangelist for vertical slice architecture and domain driven design; skilled at mentoring teams through computer science concepts and applying them to architectural transformation."
  - "Mastery across data storage types and streaming architectures for high-performance, resilient systems."
  - "Relationship builder across engineering, product, and leadership to reduce complexity, improve collaboration, and drive operational excellence."

jobs:
  - org: Caylent
    location: Remote
    title: Senior Transformation Architect, Presales
    dates: May 2026 - Present
    summary: "Worked with sales leadership to engage product and technology executives and build reference designs for engagements of every size, from small six-week RAG chatbot exercises to large, multi-workstream, six-month agentic workflow programs with multiple knowledge bases. Responsible for building trust, gathering requirements, scoping engagements, and writing proposals and Statements of Work, with a focus on software modernization, cloud adoption, and AI-DLC."
    bullets:
      - "Responsible for building, prototyping and evangelizing emergent AWS technologies in the GenAI space, specifically Amazon Connect, Bedrock, and Application Modernization offerings."
      - "Provided code analysis assessments for modernization of legacy .NET and SQL workloads onto AWS, with a phased approach to reduce risk and cost."
      - "Defined repeatable paths for taking apps built on Supabase and Vercel to production-grade AWS infrastructure."
      - "Designed event-driven and agentic workflows on Bedrock, Step Functions, and Fargate to automate business processes with AI."
      - "Scoped cloud foundation conversations with Control Tower landing zones for regulated environments such as higher education, GovCloud, and financial services."
      - "Introduced new delivery models, including AI-DLC with Kiro and Claude Code adoption to ship features with GenAI tools."
    tags: [AWS, Bedrock, Agentic AI, Modernization, Presales]

  - org: Caylent
    location: Remote
    title: Senior Software Architect, Serverless Apps
    dates: February 2024 - April 2026
    summary: "Consultant for fintech and healthcare clients modernizing existing SaaS stacks. Set technical direction and managed customer expectations on multiple engagements, working closely with client teams on requirements, scoping, delivery, and knowledge transfer. Actively shaped team culture by leading an ERG, mentoring teammates on their career journeys, and writing blog posts for marketing."
    bullets:
      - "Deployed a GenAI knowledge center and chatbot app to production using Amazon Bedrock, Titan Embeddings, and a multi-stage structured chunking ingestion pipeline built with Textract and Python."
      - "Created a transactional data simulator for an FDIC compliance application that used LLM-based statistical modeling to produce synthetic data for hundreds of millions of daily bank account activities."
      - "Delivered a reusable multi-tenant dependency injection framework and management app for AWS Step Functions, letting multiple tenants reuse existing artifacts and ops teams manage scheduling without complex IaC pipeline changes."
      - "Led engineering teams in moving legacy scheduled tasks to Lambda and EventBridge, cutting the cost of periodic tasks by over 90%."
      - "Migrated an HP 3000 mainframe system from file-based source control and job scheduling to GitHub and AWS CodeDeploy, with comprehensive staff training and documentation."
      - "Provided thought leadership with an account executive for one of Caylent's top 10 accounts, growing the portfolio to nearly $4M in work expansion and renewals as a technical strategist."
